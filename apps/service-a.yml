apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: service-a
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/jitukiwis22/gitops-test.git
    targetRevision: master
    path: services/service-a

  destination:
    server: https://kubernetes.default.svc
    namespace: service-a

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
